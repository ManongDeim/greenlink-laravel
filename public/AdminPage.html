<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>

   <!-- Tab Icon -->
  <link rel="icon" type="image/png" href="./src/Pictures/LogoLolasayong2.png">

  <title>Admin Dashboard</title>
</head>
<body class="font-sans bg-gray-100">

   
  <!-- Top Bar -->
  <header class="flex items-center justify-between px-6 py-3 text-black bg-teal-700 shadow">
       <!-- Logo -->
     <a href="./homePage.html">
    <img src="./src/Pictures/LogoLolasayong2.png" alt="Logo" class="object-contain w-auto h-20 transition-transform duration-300 cursor-pointer hover:scale-105 hover:drop-shadow-lg">
      </a>
      <!-- Right: Auth Section -->
<div id="auth-section" class="flex items-center">
  <a id="loginBtn"
     class="flex items-center gap-2 px-4 py-2 transition border border-gray-300 rounded-full shadow-sm hover:bg-gray-100">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" />
    <span class="text-sm font-medium">Log-in</span>
  </a>
</div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 min-h-screen p-4 space-y-4 bg-white shadow-lg">
      <nav class="space-y-2">
        <button data-section="food" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🍴 Food Inventory
        </button>
        <button  data-section="kitchen" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
        🍳 Kitchen Inventory
        </button>
        <button class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400"
        data-section="farm">
         🌾 Farm Inventory
        </button>
        <button data-section="farmProducts" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🌾 Farm Products
        </button>
        <!-- Food Orders -->
<button data-section="foodOrders" id="foodOrdersBtn" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
  🛒 Food Orders
</button>

<!-- Food Orders Submenu -->
<div id="foodOrdersSubmenu" class="hidden ml-6 mt-2 space-y-2">
  <button data-status="Pending" class="food-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-teal-100">
    Pending Food Orders
  </button>
  <button data-status="Completed" class="food-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-green-100">
    Completed Food Orders
  </button>
  <button data-status="Cancelled" class="food-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-red-100">
    Cancelled Food Orders
  </button>
</div>

<!-- Farm Orders -->
<button data-section="farmOrders" id="farmOrdersBtn"
  class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
  🚜 Farm Orders
</button>

<!-- Farm Orders Submenu -->
<div id="farmOrdersSubmenu" class="hidden ml-6 mt-2 space-y-2">
  <button data-status="Pending" class="farm-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-teal-100">
    Pending Farm Orders
  </button>
  <button data-status="Completed" class="farm-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-green-100">
    Completed Farm Orders
  </button>
  <button data-status="Cancelled" class="farm-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-red-100">
    Cancelled Farm Orders
  </button>
</div>


        <button data-section="room" id="roomReservationsBtn" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🏡 Room Reservation
        </button>
        
<!-- Room Reservations Submenu -->
<div id="roomReservationsSubmenu" class="hidden ml-6 mt-2 space-y-2">
  <button data-status="Pending" class="room-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-teal-100">
    Pending Reservations
  </button>
  <button data-status="Checked-in" class="room-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-green-100">
    Checked-in Reservations
  </button>
  <button data-status="Checked-out" class="room-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-blue-100">
    Checked-out Reservations
  </button>
  <button data-status="Cancelled" class="room-status-btn block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-red-100">
    Cancelled Reservations
  </button>
</div>

        <button data-section="event" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          📅 Event Reservation
        </button>
        <button data-section="addProducts" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
         📄 Page Management
        </button>
        <button data-section="cancel" class="flex items-center w-full px-4 py-2 text-red-700 transition bg-red-100 border border-transparent rounded-lg sidebar-btn hover:bg-red-200 hover:border-red-400">
          ❌ Cancellation
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main id="content" class="flex-1 p-6">
      
    </main>
  </div>

 <!-- Modals -->

 <!-- Food Order Modal -->

  <div id="foodOrderModal" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 z-50 p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-lg relative shadow-lg">
    <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
    
    <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-4"></h2>
    <ul id="modalItems" class="list-disc list-inside text-gray-700 mb-4"></ul>
    <p id="modalTotal" class="font-semibold text-gray-800 mb-2"></p>
    <p id="modalRef" class="text-gray-600 mb-4"></p>
    
    <div id="modalButtons" class="flex gap-4 mt-4">
      <button id="completeOrderBtn" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Complete</button>
      <button id="cancelOrderBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">Cancel</button>
    </div>
  </div>
</div>

<!-- Farm Order Details Modal -->
<div id="farmOrderModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 p-4 hidden">
  <div class="w-full max-w-2xl rounded-2xl bg-white shadow-lg p-6 relative">
    <button id="farmCloseModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800">✕</button>

    <h3 id="farmModalTitle" class="text-xl font-bold text-gray-800 mb-1"></h3>
    <p id="farmModalRef" class="text-sm text-gray-600 mb-4"></p>

    <div>
      <h4 class="font-semibold text-gray-700">Items</h4>
      <ul id="farmModalItems" class="list-disc list-inside text-gray-700 mb-4"></ul>
      <p id="farmModalTotal" class="font-semibold text-gray-800 mb-2"></p>
      <p id="farmModalOrderStatus" class="text-sm text-gray-600 mb-4"></p>
    </div>

    <div id="farmModalButtons" class="mt-4 flex gap-3 justify-end">
      <button id="farmCompleteBtn" class="px-4 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-700">Complete Order</button>
      <button id="farmCancelBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">Cancel Order</button>
    </div>
  </div>
</div>

<!-- Room Reservation Details Modal -->
<div id="roomReservationModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 p-4 hidden">
  <div class="bg-white rounded-2xl p-6 w-full max-w-lg relative shadow-lg">
    <button id="closeRoomModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
    <h2 id="roomModalTitle" class="text-xl font-bold text-gray-800 mb-4"></h2>
    <ul id="roomModalItems" class="list-disc list-inside text-gray-700 mb-4"></ul>
    <p id="roomModalTotal" class="font-semibold text-gray-800 mb-2"></p>
    <p id="roomModalRef" class="text-gray-600 mb-4"></p>

    <div id="roomModalButtons" class="flex gap-4 mt-4">
      <button id="checkInBtn" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Check-in</button>
      <button id="checkOutBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Check-out</button>
      <button id="cancelRoomBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">Cancel</button>
    </div>
  </div>
</div>

<div id="spoilageModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 hidden p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md relative shadow-lg">
    <button onclick="closeSpoilageModal()" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
    <h2 class="text-xl font-bold text-gray-800 mb-4">Spoilage / Loss</h2>
    <input type="hidden" id="spoilageItemId">

    <div class="mb-4">
      <label class="block mb-1 font-semibold">Quantity:</label>
      <input type="number" id="spoilageQty" class="w-full px-3 py-2 border rounded" step="0.001" min="0">
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-semibold">Reason:</label>
      <textarea id="spoilageReason" class="w-full px-3 py-2 border rounded"></textarea>
    </div>

    <div class="flex justify-end gap-4">
      <button onclick="closeSpoilageModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancel</button>
      <button onclick="submitSpoilage()" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Submit</button>
    </div>
  </div>
</div>

<!-- Add Farm Item Modal -->
<!-- 🌾 Add Farm Item Modal -->
<div id="addFarmModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 hidden">
  <div class="bg-white p-6 rounded-2xl w-full max-w-md shadow-lg">
    <h2 class="text-xl font-bold mb-4 text-teal-700">Add Farm Item</h2>

    <form id="addFarmForm" onsubmit="submitAddFarmItem(event)" class="space-y-3">
      <input type="text" name="item_name" placeholder="Item Name" required class="w-full border rounded-lg p-2">

      <input type="text" name="min_stock" placeholder="Minimum Stock" required
        class="w-full border rounded-lg p-2" oninput="validateFloatInput(this)">

      <input type="text" name="current_stock" placeholder="Current Stock" required
        class="w-full border rounded-lg p-2" oninput="validateFloatInput(this)">

      <input type="text" name="unit" placeholder="Unit (e.g., kg, pcs, bundle)" required
        class="w-full border rounded-lg p-2">

      <input type="text" name="unit_cost" placeholder="Unit Cost (₱ per unit)" required
        class="w-full border rounded-lg p-2" oninput="validateFloatInput(this)">

      <div class="flex justify-end gap-3 mt-4">
        <button type="button" onclick="closeAddFarmModal()" class="px-4 py-2 bg-gray-300 rounded-lg">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700">Add</button>
      </div>
    </form>
  </div>
</div>


<!-- Add Farm Item Modal -->
<div id="addFarmModal" class="fixed inset-0 hidden bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-md">
    <h2 class="text-xl font-bold text-teal-700 mb-4">Add Farm Item</h2>
    <form id="addFarmForm" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-700">Item Name</label>
        <input name="item_name" type="text" class="w-full border rounded-lg p-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Min Stock</label>
        <input name="min_stock" type="number" step="0.001" class="w-full border rounded-lg p-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Current Stock</label>
        <input name="current_stock" type="number" step="0.001" class="w-full border rounded-lg p-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Unit</label>
        <input name="unit" type="text" placeholder="e.g., kg, pcs, dozen" class="w-full border rounded-lg p-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Unit Conversion</label>
        <input name="unit_conversion" type="number" step="0.001" value="1" class="w-full border rounded-lg p-2" required>
        <p class="text-xs text-gray-500">How much inventory is reduced per 1 order (e.g., 0.5 for half kg/dozen)</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Unit Cost</label>
        <input name="unit_cost" type="number" step="0.01" class="w-full border rounded-lg p-2" required>
      </div>

      <div class="flex justify-end space-x-2 pt-3">
        <button type="button" onclick="closeAddFarmModal()" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">Cancel</button>
        <button type="button" onclick="submitAddFarmItem()" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700">Save</button>
      </div>
    </form>
  </div>
</div>


<div id="farmSpoilageModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 hidden p-4">
  <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-lg relative">
    <h2 class="text-xl font-bold text-teal-700 mb-4">Spoilage / Loss</h2>

    <input type="hidden" id="farmSpoilageItemId">

    <label class="block font-semibold">Quantity Lost</label>
    <input type="number" id="farmSpoilageQty"
           class="w-full border rounded-lg px-3 py-2 mb-3" step="0.001">

    <label class="block font-semibold">Reason</label>
    <textarea id="farmSpoilageReason" class="w-full border rounded-lg px-3 py-2 mb-4"></textarea>

    <div class="flex justify-end gap-3">
      <button onclick="closeFarmSpoilageModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
      <button onclick="submitFarmSpoilage()" class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">Submit</button>
    </div>
  </div>
</div>



<div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2"></div>

<script src="./scripts/adminPage.js"></script>
<script src="./global_scripts/loginScript.js" defer></script>
<script src="./global_scripts/authLogin.js"></script>
</body>
</html>
