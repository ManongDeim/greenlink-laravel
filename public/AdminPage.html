<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>

   <!-- Tab Icon -->
  <link rel="icon" type="image/png" href="./src/Pictures/LogoLolasayong2.png">

  <title>Admin Dashboard</title>
</head>
<body class="font-sans bg-gray-100">

   
  <!-- Top Bar -->
  <header class="flex items-center justify-between px-6 py-3 text-black bg-teal-700 shadow">
       <!-- Logo -->
     <a href="./homePage.html">
    <img src="./src/Pictures/LogoLolasayong2.png" alt="Logo" class="object-contain w-auto h-20 transition-transform duration-300 cursor-pointer hover:scale-105 hover:drop-shadow-lg">
      </a>
      <!-- Right: Auth Section -->
<div id="auth-section" class="flex items-center">
  <a id="loginBtn"
     class="flex items-center gap-2 px-4 py-2 transition border border-gray-300 rounded-full shadow-sm hover:bg-gray-100">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" />
    <span class="text-sm font-medium">Log-in</span>
  </a>
</div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 min-h-screen p-4 space-y-4 bg-white shadow-lg">
      <nav class="space-y-2">
        <button data-section="food" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🍴 Food Inventory
        </button>
        <button  data-section="kitchen" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
        🍳 Kitchen Inventory
        </button>
        <button data-section="farm" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🌾 Farm Inventory
        </button>
        <button data-section="foodOrders" id="foodOrdersBtn" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🛒 Food Orders
        </button>

        <!-- Submenu (hidden by default) -->
      <div id="foodOrdersSubmenu" class="hidden ml-6 mt-2 space-y-2">
        <button data-status="Pending" class="block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-teal-100">
        Pending Food Orders
        </button>
        <button data-status="Completed" class="block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-green-100">
        Completed Food Orders
        </button>
        <button data-status="Cancelled" class="block w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-red-100">
        Cancelled Food Orders
        </button>
      </div>

        <button data-section="farmOrders" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🚜 Farm Orders
        </button>
        <button data-section="room" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🏡 Room Reservation
        </button>
        <button data-section="event" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          📅 Event Reservation
        </button>
        <button data-section="addProducts" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
         📄 Page Management
        </button>
        <button data-section="cancel" class="flex items-center w-full px-4 py-2 text-red-700 transition bg-red-100 border border-transparent rounded-lg sidebar-btn hover:bg-red-200 hover:border-red-400">
          ❌ Cancellation
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main id="content" class="flex-1 p-6">
      
    </main>
  </div>

 <!-- Modals -->

 <!-- Food Order Modal -->

  <div id="foodOrderModal" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 z-50 p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-lg relative shadow-lg">
    <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✖</button>
    
    <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-4"></h2>
    <ul id="modalItems" class="list-disc list-inside text-gray-700 mb-4"></ul>
    <p id="modalTotal" class="font-semibold text-gray-800 mb-2"></p>
    <p id="modalRef" class="text-gray-600 mb-4"></p>
    
    <div id="modalButtons" class="flex gap-4 mt-4">
      <button id="completeOrderBtn" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Complete</button>
      <button id="cancelOrderBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">Cancel</button>
    </div>
  </div>
</div>

<!-- Farm Order Details Modal -->
<div id="farmOrderModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-2xl rounded-2xl bg-white shadow-lg p-6 relative">
    <button id="farmCloseModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800">
      ✕
    </button>

    <h3 id="farmModalTitle" class="text-xl font-bold text-gray-800 mb-2"></h3>
    <p id="farmModalRef" class="text-sm text-gray-600 mb-4"></p>

    <div>
      <h4 class="font-semibold text-gray-700">Items</h4>
      <ul id="farmModalItems" class="list-disc list-inside text-gray-700 mb-4"></ul>
      <p id="farmModalTotal" class="font-semibold text-gray-800 mb-2"></p>
      <p id="farmModalOrderStatus" class="text-sm text-gray-600 mb-4"></p>
    </div>

    <div id="farmModalButtons" class="mt-4 flex gap-3 justify-end">
      <button id="farmCompleteBtn" class="px-4 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-700">Complete Order</button>
      <button id="farmCancelBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">Cancel Order</button>
    </div>
  </div>

<div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2"></div>

<script src="./scripts/adminPage.js"></script>
<script src="./global_scripts/loginScript.js" defer></script>
<script src="./global_scripts/authLogin.js"></script>
</body>
</html>
