<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>

   <!-- Tab Icon -->
  <link rel="icon" type="image/png" href="./src/Pictures/LogoLolasayong2.png">

  <title>Admin Dashboard</title>
</head>
<body class="font-sans bg-gray-100">

  <!-- Top Bar -->
  <header class="flex items-center justify-between px-6 py-3 text-black bg-teal-700 shadow">
      <!-- Right: Auth Section -->
<div id="auth-section" class="flex items-center">
  <a id="loginBtn"
     class="flex items-center gap-2 px-4 py-2 transition border border-gray-300 rounded-full shadow-sm hover:bg-gray-100">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" />
    <span class="text-sm font-medium">Log-in</span>
  </a>
</div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 min-h-screen p-4 space-y-4 bg-white shadow-lg">
      <nav class="space-y-2">
        <button data-section="food" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🍴 Food Inventory
        </button>
        <button  data-section="kitchen" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
        🍳 Kitchen Inventory
        </button>
        <button data-section="farm" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🌾 Farm Inventory
        </button>
        <button data-section="foodOrders" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🛒 Food Orders
        </button>

        <!-- Submenu (hidden by default) -->
      <div id="foodOrdersSubmenu" class="hidden ml-6 mt-2 space-y-2">
       <button data-status="Pending" class="block w-full text-left px-3 py-2 text-sm text-gray-700 rounded-md bg-gray-50 hover:bg-teal-100">Pending Food Orders</button>
       <button data-status="Completed" class="block w-full text-left px-3 py-2 text-sm text-gray-700 rounded-md bg-gray-50 hover:bg-teal-100">Completed Food Orders</button>
       <button data-status="Cancelled" class="block w-full text-left px-3 py-2 text-sm text-gray-700 rounded-md bg-gray-50 hover:bg-teal-100">Cancelled Food Orders</button>
      </div>

        <button data-section="farmOrders" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🚜 Farm Orders
        </button>
        <button data-section="room" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🏡 Room Reservation
        </button>
        <button data-section="event" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          📅 Event Reservation
        </button>
        <button data-section="addProducts" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
         📄 Page Management
        </button>
        <button data-section="cancel" class="flex items-center w-full px-4 py-2 text-red-700 transition bg-red-100 border border-transparent rounded-lg sidebar-btn hover:bg-red-200 hover:border-red-400">
          ❌ Cancellation
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main id="content" class="flex-1 p-6">
      
    </main>
  </div>

<div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2"></div>

<script src="./scripts/adminPage.js"></script>
<script src="./global_scripts/loginScript.js" defer></script>
<script src="./global_scripts/authLogin.js"></script>
</body>
</html>
