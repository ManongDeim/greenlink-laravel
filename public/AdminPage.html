<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>

   <!-- Tab Icon -->
  <link rel="icon" type="image/png" href="./src/Pictures/LogoLolasayong2.png">

  <title>Admin Dashboard</title>
</head>
<body class="font-sans bg-gray-100">

   
  <!-- Top Bar -->
  <header class="flex items-center justify-between px-6 py-3 text-black bg-teal-700 shadow">
       <!-- Logo -->
     <a href="./homePage.html">
    <img src="./src/Pictures/LogoLolasayong2.png" alt="Logo" class="object-contain w-auto h-20 transition-transform duration-300 cursor-pointer hover:scale-105 hover:drop-shadow-lg">
      </a>
      <!-- Right: Auth Section -->
<div id="auth-section" class="flex items-center">
  <a id="loginBtn"
     class="flex items-center gap-2 px-4 py-2 transition border border-gray-300 rounded-full shadow-sm hover:bg-gray-100">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" />
    <span class="text-sm font-medium">Log-in</span>
  </a>
</div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 min-h-screen p-4 space-y-4 bg-white shadow-lg">
      <nav class="space-y-2">
        <button  data-section="kitchen" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
        🍳 Kitchen Inventory
        </button>
        <button class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400"
        data-section="farm">
         🌾 Farm Inventory
        </button>
        
        <!-- Food Orders -->
<button data-section="foodOrders" id="foodOrdersBtn" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
  🛒 Food Orders
</button>

<!-- Food Orders Submenu -->
<div id="foodOrdersSubmenu" class="hidden mt-2 ml-6 space-y-2">
  <button data-status="Pending" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg food-status-btn hover:bg-teal-100">
    Pending Food Orders
  </button>
  <button data-status="Completed" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg food-status-btn hover:bg-green-100">
    Completed Food Orders
  </button>
  <button data-status="Cancelled" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg food-status-btn hover:bg-red-100">
    Cancelled Food Orders
  </button>
</div>

<!-- Farm Orders -->
<button data-section="farmOrders" id="farmOrdersBtn"
  class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
  🚜 Farm Orders
</button>

<!-- Farm Orders Submenu -->
<div id="farmOrdersSubmenu" class="hidden mt-2 ml-6 space-y-2">
  <button data-status="Pending" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg farm-status-btn hover:bg-teal-100">
    Pending Farm Orders
  </button>
  <button data-status="Completed" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg farm-status-btn hover:bg-green-100">
    Completed Farm Orders
  </button>
  <button data-status="Cancelled" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg farm-status-btn hover:bg-red-100">
    Cancelled Farm Orders
  </button>
</div>


        <button data-section="room" id="roomReservationsBtn" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🏡 Room Reservation
        </button>
        
<!-- Room Reservations Submenu -->
<div id="roomReservationsSubmenu" class="hidden mt-2 ml-6 space-y-2">
  <button data-status="Pending" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg room-status-btn hover:bg-teal-100">
    Pending Reservations
  </button>
  <button data-status="Checked-in" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg room-status-btn hover:bg-green-100">
    Checked-in Reservations
  </button>
  <button data-status="Checked-out" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg room-status-btn hover:bg-blue-100">
    Checked-out Reservations
  </button>
  <button data-status="Cancelled" class="block w-full px-4 py-2 text-left text-gray-600 rounded-lg room-status-btn hover:bg-red-100">
    Cancelled Reservations
  </button>
</div>

        <button data-section="event" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          📅 Event Reservation
        </button>

        <!-- Page Management  -->
        <button id="pageManagementBtn" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg submenu-toggle sidebar-btn hover:bg-gray-200 hover:border-gray-400">
         📄 Page Management
        </button>
        <!-- Page Management Submenu -->
    <div id="pageManagementSubmenu" class="hidden mt-2 ml-6 space-y-2">
      <button data-section="food" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🍴 Food Items
        </button>
      <button data-section="farmProducts" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🌾 Farm Products
        </button>
        <button data-section="roomManagement" class="flex items-center w-full px-4 py-2 text-gray-700 transition bg-gray-100 border border-transparent rounded-lg whitespace-nowrap sidebar-btn hover:bg-gray-200 hover:border-gray-400">
          🏡 Room Management
        </button>
    </div>
        <button data-section="cancel" class="flex items-center w-full px-4 py-2 text-red-700 transition bg-red-100 border border-transparent rounded-lg sidebar-btn hover:bg-red-200 hover:border-red-400">
          ❌ Cancellation
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main id="content" class="flex-1 p-6">
      
    </main>
  </div>

 <!-- Modals -->

 <!-- Food Order Modal -->

  <div id="foodOrderModal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-black/50">
  <div class="relative w-full max-w-lg p-6 bg-white shadow-lg rounded-2xl">
    <button id="closeModal" class="absolute text-gray-500 top-2 right-2 hover:text-gray-700">✖</button>
    
    <h2 id="modalTitle" class="mb-4 text-xl font-bold text-gray-800"></h2>
    <ul id="modalItems" class="mb-4 text-gray-700 list-disc list-inside"></ul>
    <p id="modalTotal" class="mb-2 font-semibold text-gray-800"></p>
    <p id="modalRef" class="mb-4 text-gray-600"></p>
    
    <div id="modalButtons" class="flex gap-4 mt-4">
      <button id="completeOrderBtn" class="px-4 py-2 text-white bg-teal-600 rounded-lg hover:bg-teal-700">Complete</button>
      <button id="cancelOrderBtn" class="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700">Cancel</button>
    </div>
  </div>
</div>

<!-- Farm Order Details Modal -->
<div id="farmOrderModal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-black/50">
  <div class="relative w-full max-w-2xl p-6 bg-white shadow-lg rounded-2xl">
    <button id="farmCloseModal" class="absolute text-gray-500 top-3 right-3 hover:text-gray-800">✕</button>

    <h3 id="farmModalTitle" class="mb-1 text-xl font-bold text-gray-800"></h3>
    <p id="farmModalRef" class="mb-4 text-sm text-gray-600"></p>

    <div>
      <h4 class="font-semibold text-gray-700">Items</h4>
      <ul id="farmModalItems" class="mb-4 text-gray-700 list-disc list-inside"></ul>
      <p id="farmModalTotal" class="mb-2 font-semibold text-gray-800"></p>
      <p id="farmModalOrderStatus" class="mb-4 text-sm text-gray-600"></p>
    </div>

    <div id="farmModalButtons" class="flex justify-end gap-3 mt-4">
      <button id="farmCompleteBtn" class="px-4 py-2 text-white bg-teal-600 rounded-lg hover:bg-teal-700">Complete Order</button>
      <button id="farmCancelBtn" class="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700">Cancel Order</button>
    </div>
  </div>
</div>

<!-- Room Reservation Details Modal -->
<div id="roomReservationModal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-black/50">
  <div class="relative w-full max-w-lg p-6 bg-white shadow-lg rounded-2xl">
    <button id="closeRoomModal" class="absolute text-gray-500 top-2 right-2 hover:text-gray-700">✖</button>
    <h2 id="roomModalTitle" class="mb-4 text-xl font-bold text-gray-800"></h2>
    <ul id="roomModalItems" class="mb-4 text-gray-700 list-disc list-inside"></ul>
    <p id="roomModalTotal" class="mb-2 font-semibold text-gray-800"></p>
    <p id="roomModalRef" class="mb-4 text-gray-600"></p>

    <div id="roomModalButtons" class="flex gap-4 mt-4">
      <button id="checkInBtn" class="px-4 py-2 text-white bg-teal-600 rounded-lg hover:bg-teal-700">Check-in</button>
      <button id="checkOutBtn" class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700">Check-out</button>
      <button id="cancelRoomBtn" class="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700">Cancel</button>
    </div>
  </div>
</div>

<div id="spoilageModal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-black/50">
  <div class="relative w-full max-w-md p-6 bg-white shadow-lg rounded-2xl">
    <button onclick="closeSpoilageModal()" class="absolute text-gray-500 top-2 right-2 hover:text-gray-700">✖</button>
    <h2 class="mb-4 text-xl font-bold text-gray-800">Spoilage / Loss</h2>
    <input type="hidden" id="spoilageItemId">

    <div class="mb-4">
      <label class="block mb-1 font-semibold">Quantity:</label>
      <input type="number" id="spoilageQty" class="w-full px-3 py-2 border rounded" step="0.001" min="0">
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-semibold">Reason:</label>
      <textarea id="spoilageReason" class="w-full px-3 py-2 border rounded"></textarea>
    </div>

    <div class="flex justify-end gap-4">
      <button onclick="closeSpoilageModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancel</button>
      <button onclick="submitSpoilage()" class="px-4 py-2 text-white bg-yellow-500 rounded hover:bg-yellow-600">Submit</button>
    </div>
  </div>
</div>

<!-- 🌾 Add Farm Item Modal -->
<div id="addFarmModal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black bg-opacity-50">
  <div class="relative w-full max-w-lg p-6 bg-white shadow-lg rounded-xl">
    <h2 class="mb-4 text-xl font-bold">Add Farm Inventory Item</h2>

    <form id="addFarmForm" onsubmit="submitAddFarmItem(event)">
      <div class="grid grid-cols-2 gap-4">

        <!-- Item Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Item Name</label>
          <input type="text" name="item_name" required
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400">
        </div>

        <!-- Unit -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Unit</label>
          <input type="text" name="unit" placeholder="e.g. kg, dozen, piece"
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400">
        </div>

        <!-- Minimum Stock -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Minimum Stock</label>
          <input type="number" step="0.01" name="min_stock" required
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400">
        </div>

        <!-- Current Stock -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Current Stock</label>
          <input type="number" step="0.01" name="current_stock" required
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400">
        </div>

        <!-- Unit Cost -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Unit Cost (₱)</label>
          <input type="number" step="0.01" name="unit_cost" required
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400">
        </div>

        <!-- Conversion Rate -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Conversion Rate</label>
          <input type="number" step="0.01" name="unit_conversion" placeholder="1 if same (e.g. 0.5 for 500g)"
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-400">
          <p class="mt-1 text-xs text-gray-500">
            Example: If item sold per 500g but stored in kg → enter 0.5
          </p>
        </div>
      </div>

      <div class="flex justify-end mt-6 space-x-2">
        <button type="button" onclick="closeAddFarmModal()"
                class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-2 text-white bg-green-600 rounded hover:bg-green-700">
          Add Item
        </button>
      </div>
    </form>
  </div>
</div>



<div id="farmSpoilageModal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-black/50">
  <div class="relative w-full max-w-md p-6 bg-white shadow-lg rounded-xl">
    <h2 class="mb-4 text-xl font-bold text-teal-700">Spoilage / Loss</h2>

    <input type="hidden" id="farmSpoilageItemId">

    <label class="block font-semibold">Quantity Lost</label>
    <input type="number" id="farmSpoilageQty"
           class="w-full px-3 py-2 mb-3 border rounded-lg" step="0.001">

    <label class="block font-semibold">Reason</label>
    <textarea id="farmSpoilageReason" class="w-full px-3 py-2 mb-4 border rounded-lg"></textarea>

    <div class="flex justify-end gap-3">
      <button onclick="closeFarmSpoilageModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
      <button onclick="submitFarmSpoilage()" class="px-4 py-2 text-white bg-yellow-500 rounded-lg hover:bg-yellow-600">Submit</button>
    </div>
  </div>
</div>

<!-- Add Farm Stock Modal -->
<div id="farmStockModal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/50">
  <div class="relative w-full max-w-md p-6 bg-white shadow-lg rounded-xl">
    <h2 class="mb-4 text-xl font-bold text-teal-700">Add Stock</h2>

    <input type="hidden" id="farmStockItemId">

    <label class="block mb-1 font-semibold">Quantity to Add</label>
    <input type="number" id="farmStockAmount"
           class="w-full px-3 py-2 mb-4 border rounded-lg" step="0.001">

    <div class="flex justify-end gap-3">
      <button onclick="closeFarmStockModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
      <button onclick="submitFarmStock()" class="px-4 py-2 text-white bg-teal-600 rounded-lg hover:bg-teal-700">Add</button>
    </div>
  </div>
</div>

<div id="farmSpoilageModal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-black/50">
  <div class="relative w-full max-w-md p-6 bg-white shadow-lg rounded-xl">
    <h2 class="mb-4 text-xl font-bold text-teal-700">Spoilage / Loss</h2>

    <input type="hidden" id="farmSpoilageItemId">

    <label class="block font-semibold">Quantity Lost</label>
    <input type="number" id="farmSpoilageQty"
           class="w-full px-3 py-2 mb-3 border rounded-lg" step="0.001">

    <label class="block font-semibold">Reason</label>
    <textarea id="farmSpoilageReason" class="w-full px-3 py-2 mb-4 border rounded-lg"></textarea>

    <div class="flex justify-end gap-3">
      <button onclick="closeFarmSpoilageModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
      <button onclick="submitFarmSpoilage()" class="px-4 py-2 text-white bg-yellow-500 rounded-lg hover:bg-yellow-600">Submit</button>
    </div>
  </div>
</div>

<div id="toast-container" class="fixed z-50 space-y-2 top-5 right-5"></div>

<script src="./scripts/adminPage.js"></script>
<script src="./global_scripts/loginScript.js" defer></script>
<script src="./global_scripts/authLogin.js"></script>
</body>
</html>
