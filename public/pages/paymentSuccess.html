<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex items-center justify-center min-h-screen p-6 bg-gray-100">

  <div class="w-full max-w-lg p-10 text-center bg-white shadow-xl rounded-2xl">
    <!-- Success Icon -->
    <div class="flex justify-center">
      <div class="flex items-center justify-center w-24 h-24 text-green-600 bg-green-100 rounded-full shadow-inner">
        <i class="text-5xl fa-solid fa-check"></i>
      </div>
    </div>

    <!-- Title -->
    <h1 class="mt-6 text-3xl font-bold text-gray-800">Payment Successful!</h1>

    <!-- Message -->
    <p class="mt-3 leading-relaxed text-gray-600">
      Your payment has been processed successfully.<br>
      Thank you for your purchase!
    </p>

    <!-- Divider -->
    <div class="w-full h-px my-6 bg-gray-200"></div>

    <!-- Continue Button -->
    <a 
      href="/" class="inline-block px-6 py-3 font-medium text-white transition shadow-md bg-gradient-to-r from-teal-700 via-teal-600 to-teal-500 rounded-xl hover:opacity-90">
      Continue Shopping
    </a>
  </div>

</body>
</html>
